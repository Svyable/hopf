name: Observatory Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/app.mjs && node --check docs/atlas.mjs && node --check docs/symmetry.mjs && node --check docs/experience.mjs && node --check docs/studio.mjs && node --check docs/arithmetic.mjs && node --check docs/bridge.mjs && node --check docs/fibration-model.mjs && node --check docs/fibration.mjs && node --check docs/matter.mjs && node --check docs/heat.mjs && node --check docs/heat-model.mjs && node --check docs/resonance.mjs && node --check docs/resonance-model.mjs && node --check docs/coherence.mjs && node --check docs/coherence-model.mjs && node --check docs/temporal.mjs && node --check docs/temporal-model.mjs && node --check docs/observer.mjs && node --check docs/observer-model.mjs && node --check docs/workbench.mjs && node --check docs/workbench-model.mjs
      - run: node --test tests/*.test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # One artifact name per attempt: a re-run otherwise finds two "github-pages"
      # artifacts in the same run and deploy-pages refuses to choose.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # The first attempt sometimes fails transiently (artifact not yet visible, or
      # "Deployment failed, try again later"); retry once before failing the run.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry deploy
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
